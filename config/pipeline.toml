# 处理配置草案，供后续 runner 实现。当前 plan 只显示阶段，不读取此文件执行。
schema_version = 1

[render]
dpi = 300
preserve_original = true

[recognition]
method = "assistant-multimodal"
# 当前助手直接看图转录；不配置外部识别 API、OCR 服务或本地 OCR 引擎。
# 仅记录已知模型信息，未知时留空。
model = ""
prompt_version = "transcribe-page-v1"

[editorial]
preserve_variant_characters = true
automatic_simplification = false
automatic_punctuation = false

[publication]
source_directory = "src"
exclude = ["md/**", "**/*.md", "editorial/**"]
# build-book 已仅收集 src；本草案仍未被统一 runner 读取。
profile = "hanqing-zh-v1"
writing_mode = "horizontal-tb"
require_human_review = true
require_epubcheck = true
